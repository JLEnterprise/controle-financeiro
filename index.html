<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1424">
<meta name="color-scheme" content="dark">
<title>JL Finance</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23F1E3C4'/%3E%3Cstop offset='.5' stop-color='%23D2B47C'/%3E%3Cstop offset='1' stop-color='%239E7C45'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='1' y='1' width='38' height='38' rx='11' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%230E1424' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M16 10v13.5a4.5 4.5 0 0 1-4.5 4.5H10'/%3E%3Cpath d='M22 10v18h9'/%3E%3C/g%3E%3Cg fill='none' stroke='%230E1424' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M25.5 23.5l5-5'/%3E%3Cpath d='M27.5 18.5h3v3'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --ink:#0E1424; --surface:#151D31; --surface2:#1C2640; --line:#28334F;
  --text:#EEF0F5; --text2:#C4CADB; --mute:#8F99B3;
  --gold:#D8C3A0; --gold2:#B89B6C;
  --ok:#5CC8A0; --warn:#E9B65C; --bad:#EE7C7C; --info:#86A8E7;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 var(--sans);min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(216,195,160,.08),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(134,168,231,.06),transparent 60%);
  background-attachment:fixed}
.serif{font-family:var(--serif);font-weight:500;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:6px}

/* topo */
header{position:sticky;top:0;z-index:20;background:rgba(14,20,36,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:19px;white-space:nowrap}
.brand svg{flex:none}
.logo{flex:none;filter:drop-shadow(0 4px 14px rgba(210,180,124,.28))}
.wordmark{display:flex;align-items:baseline;gap:7px;line-height:1}
.wm-jl{font-family:var(--serif);font-weight:600;font-size:21px;letter-spacing:.02em;
  background:linear-gradient(135deg,#F1E3C4,#D2B47C 55%,#B08D55);-webkit-background-clip:text;background-clip:text;color:transparent}
.wm-fin{font-family:var(--sans);font-weight:500;font-size:13px;letter-spacing:.32em;text-transform:uppercase;color:var(--text2)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(216,195,160,.55),transparent)}
nav.tabs{display:flex;gap:2px;margin-left:auto}
nav.tabs button{display:flex;align-items:center;gap:8px;background:none;border:0;color:var(--mute);font:500 14px var(--sans);padding:9px 14px;border-radius:10px;cursor:pointer}
nav.tabs button:hover{color:var(--text)}
nav.tabs button.on{color:var(--ink);background:linear-gradient(135deg,#F1E3C4,#D2B47C 55%,#B8955C);box-shadow:0 6px 16px -8px rgba(210,180,124,.7)}
nav.tabs svg{width:18px;height:18px}
.iconbtn{background:none;border:1px solid var(--line);color:var(--text2);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn:hover{border-color:var(--gold2);color:var(--gold)}
body.privado .money{filter:blur(8px);user-select:none}

main{max-width:1120px;margin:0 auto;padding:26px 20px 70px}
.view{animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}

/* blocos */
.sec{margin:34px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0}
.sec-h .mute{font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.mute{color:var(--mute)}
.small{font-size:13px}
.two{display:grid;gap:18px;grid-template-columns:1.25fr 1fr}
.two>*,.hero>*,.hero-side>*{min-width:0}
html,body{overflow-x:hidden}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* herói */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-main{padding:28px 28px 24px;border-radius:22px;border:1px solid #3a3a3f;background:
  linear-gradient(155deg,#1f2840 0%,#151d31 55%,#1b1c26 100%);position:relative;overflow:hidden}
.hero-main::after{content:"";position:absolute;right:-80px;top:-80px;width:260px;height:260px;border-radius:50%;border:1px solid rgba(216,195,160,.18);box-shadow:0 0 0 40px rgba(216,195,160,.03),0 0 0 80px rgba(216,195,160,.02)}
.hero-label{color:var(--gold);font-size:14px}
.hero-big{font-family:var(--serif);font-size:clamp(46px,8vw,76px);line-height:1;margin:12px 0 10px;letter-spacing:-.02em}
.hero-big.neg{color:var(--bad)}
.hero-sub{color:var(--text2);max-width:46ch}
.meter{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:22px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--gold)}
.meter i.warn{background:var(--warn)} .meter i.bad{background:var(--bad)}
.meter-legend{display:flex;justify-content:space-between;font-size:12px;color:var(--mute);margin-top:8px}
.hero-side{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;justify-content:space-between;min-height:104px}
.stat .k{color:var(--mute);font-size:13px}
.stat .v{font-family:var(--serif);font-size:26px;margin-top:6px}
.stat.wide{grid-column:1/-1}
.stat .v.ok{color:var(--ok)} .stat .v.bad{color:var(--bad)}
.inline-form{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.inline-form input{max-width:220px}

/* cartões físicos */
.rail{display:flex;gap:16px;overflow-x:auto;padding:4px 2px 14px;scroll-snap-type:x mandatory;scrollbar-width:thin}
.pcard{flex:none;width:300px;aspect-ratio:1.586;border-radius:18px;padding:18px 20px;color:#fff;text-align:left;border:0;cursor:pointer;scroll-snap-align:start;
  background:linear-gradient(135deg,var(--c1),var(--c2));position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.18);font-family:var(--sans)}
.pcard::before{content:"";position:absolute;inset:0;background:radial-gradient(420px 180px at 110% -20%,rgba(255,255,255,.22),transparent 60%),repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 7px);pointer-events:none}
.pcard>*{position:relative}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start}
.pc-name{font-weight:600;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.pc-mid small{display:block;font-size:12px;opacity:.85}
.pc-mid b{font-family:var(--serif);font-weight:500;font-size:28px;text-shadow:0 1px 3px rgba(0,0,0,.3)}
.pc-foot{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.pc-bar{height:4px;border-radius:9px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:8px}
.pc-bar i{display:block;height:100%;background:#fff;border-radius:9px}
.pcard.add{background:transparent;border:1.5px dashed var(--line);color:var(--mute);align-items:center;justify-content:center;box-shadow:none;gap:8px;font-size:14px}
.pcard.add::before{display:none}
.pcard.add:hover{border-color:var(--gold2);color:var(--gold)}

/* listas */
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid rgba(40,51,79,.7)}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--mute)}
.li .r{text-align:right;white-space:nowrap}
.date{flex:none;width:46px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:5px 0;line-height:1.1}
.date b{display:block;font-family:var(--serif);font-size:19px;font-weight:500}
.date span{font-size:11px;color:var(--mute)}
.date.bad{border-color:rgba(238,124,124,.5)} .date.bad b{color:var(--bad)}
.sw{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.check{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);background:none;cursor:pointer;display:grid;place-items:center;color:transparent}
.check:hover{border-color:var(--ok)}
.check.on{background:var(--ok);border-color:var(--ok);color:var(--ink)}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.ok{background:rgba(92,200,160,.12);color:var(--ok)}
.pill.open{background:rgba(134,168,231,.12);color:var(--info)}
.pill.bad{background:rgba(238,124,124,.13);color:var(--bad)}

/* avisos */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid rgba(40,51,79,.7)}
.alert:last-child{border-bottom:0}
.alert .ic{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.alert .ic svg{width:16px;height:16px}
.alert.bad .ic{background:rgba(238,124,124,.13);color:var(--bad)}
.alert.warn .ic{background:rgba(233,182,92,.13);color:var(--warn)}
.alert.ok .ic{background:rgba(92,200,160,.12);color:var(--ok)}
.alert.info .ic{background:rgba(134,168,231,.12);color:var(--info)}
.alert b{font-weight:600}

/* gráficos */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:var(--sans);fill:var(--mute);font-size:11px}
.chart .lbl{fill:var(--text2);font-size:11.5px}
.cat{display:grid;grid-template-columns:110px 1fr auto;gap:12px;align-items:center;padding:7px 0;font-size:14px}
.cat .bar{height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.cat .bar i{display:block;height:100%;background:var(--gold2);border-radius:99px}
#tip{position:fixed;z-index:50;pointer-events:none;background:#0a0f1c;border:1px solid var(--line);color:var(--text);padding:8px 11px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .12s;white-space:nowrap}

/* formulários */
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:end}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--mute)}
input,select{width:100%;background:var(--surface2);color:var(--text);border:1px solid var(--line);border-radius:11px;padding:11px 12px;font:15px var(--sans);outline:none}
input:focus,select:focus{border-color:var(--gold2)}
input[type=month],input[type=date]{color-scheme:dark}
.btn{background:linear-gradient(135deg,#F1E3C4 0%,#D2B47C 55%,#B8955C 100%);color:var(--ink);border:0;border-radius:11px;padding:11px 16px;font:600 14px var(--sans);cursor:pointer;white-space:nowrap;
  box-shadow:0 8px 20px -10px rgba(210,180,124,.7),inset 0 1px 0 rgba(255,255,255,.45)}
.btn:hover{filter:brightness(1.07)}
.btn.ghost,.btn.danger{box-shadow:none;filter:none}
.btn.ghost{background:none;color:var(--text2);border:1px solid var(--line);font-weight:500}
.btn.ghost:hover{border-color:var(--gold2);color:var(--gold)}
.btn.danger{background:none;color:var(--bad);border:1px solid rgba(238,124,124,.35);font-weight:500}
.btn.sm{padding:7px 12px;font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.swatches{display:flex;gap:8px;flex-wrap:wrap;padding:6px 0}
.swatches input{position:absolute;opacity:0;width:0;height:0}
.swatches span{display:block;width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:inset 0 0 0 2px var(--ink)}
.swatches input:checked+span{border-color:var(--text)}
.swatches input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}

/* contorno de luz suave em todos os quadros */
.panel,.stat,.gasto,.hero-main{border-color:rgba(216,195,160,.15);
  box-shadow:0 0 0 1px rgba(216,195,160,.03),0 0 26px -10px rgba(216,195,160,.22),inset 0 1px 0 rgba(255,255,255,.035)}
.gasto:hover,.stat:hover{border-color:rgba(216,195,160,.24)}

/* lançamentos */
.seg{display:inline-flex;gap:4px;background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:4px;flex-wrap:wrap}
.seg button{background:none;border:0;color:var(--mute);font:600 14px var(--sans);padding:9px 16px;border-radius:10px;cursor:pointer;display:flex;gap:7px;align-items:center}
.seg button:hover{color:var(--text)}
.seg button.on{background:linear-gradient(135deg,#F1E3C4,#D2B47C 55%,#B8955C);color:var(--ink)}
.seg button.on.out{background:rgba(238,124,124,.16);color:var(--bad);box-shadow:inset 0 0 0 1px rgba(238,124,124,.35)}
.seg button.on.in{background:rgba(92,200,160,.16);color:var(--ok);box-shadow:inset 0 0 0 1px rgba(92,200,160,.35)}
.resumo{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:0 0 18px}
.resumo .stat{min-height:92px}
@media (max-width:600px){.resumo{grid-template-columns:1fr 1fr}.resumo .stat:last-child{grid-column:1/-1}}
.tipo{flex:none;width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font:700 16px var(--sans)}
.tipo.out{background:rgba(238,124,124,.12);color:var(--bad)}
.tipo.in{background:rgba(92,200,160,.12);color:var(--ok)}
.val-in{color:var(--ok)}
.mes-g{padding:10px 0 4px;border-bottom:1px solid var(--line)}
.mes-g:last-child{border-bottom:0}
.mes-gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0 2px;font-size:15px}
.mes-gh b{font-weight:600}
.mes-g .li{padding:10px 0 10px 18px}
.mes-g .li .s .pill{padding:1px 8px;font-size:11px;margin-left:4px}
.btn:disabled{opacity:.35;cursor:default}
.form-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.form-head h2{font-family:var(--serif);font-weight:500;font-size:22px;margin:0}
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px;margin-bottom:16px}
@media (max-width:700px){.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}}
.gasto{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.gasto summary{list-style:none;cursor:pointer;padding:16px 18px;display:flex;gap:14px;align-items:center}
.gasto summary::-webkit-details-marker{display:none}
.gasto[open] summary{border-bottom:1px solid var(--line)}
.gasto .body{padding:6px 18px 16px}
.prog{height:4px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:8px;max-width:260px}
.prog i{display:block;height:100%;background:var(--ok);border-radius:9px}
.chev{transition:transform .2s;color:var(--mute)}
.gasto[open] .chev{transform:rotate(180deg)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mute);font-weight:500;font-size:12.5px;padding:10px 6px;border-bottom:1px solid var(--line)}
td{padding:9px 6px;border-bottom:1px solid rgba(40,51,79,.6)}
tr:last-child td{border-bottom:0}

/* faturas */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
.chip{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);color:var(--text2);padding:8px 14px;border-radius:99px;cursor:pointer;font:500 14px var(--sans)}
.chip.on{border-color:var(--gold);color:var(--text);background:var(--surface2)}
.stepper{display:flex;align-items:center;gap:8px}
.fat-total{font-family:var(--serif);font-size:clamp(38px,6vw,54px);line-height:1.05;margin:6px 0}

.res{margin-top:16px;padding:16px;border-radius:14px;background:var(--surface2);line-height:1.65}
.good{color:var(--ok);font-weight:600} .badt{color:var(--bad);font-weight:600}
.empty{text-align:center;color:var(--mute);padding:34px 12px}
.empty .btn{margin-top:12px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--ink);padding:11px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%)}

/* celular: barra de navegação embaixo */
@media (max-width:760px){
  .top{padding:12px 16px}
  main{padding:20px 16px 110px}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;margin:0;justify-content:space-around;background:rgba(14,20,36,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  nav.tabs button{flex-direction:column;gap:3px;font-size:11px;padding:6px 8px;flex:1}
  nav.tabs button.on{background:linear-gradient(135deg,#F1E3C4,#D2B47C 55%,#B8955C);color:var(--ink);border-radius:12px;box-shadow:0 6px 16px -8px rgba(210,180,124,.7)}
  .brand-wrap{margin-right:auto}
  .toast{bottom:96px}
  .hero-main{padding:22px 20px}
  .pcard{width:270px}
  .cat{grid-template-columns:90px 1fr auto}
  .sec-h .mute{display:none}
  header{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--ink)}
  .gasto summary{flex-wrap:wrap;row-gap:8px}
  .gasto summary .chev{order:2}
  .gasto summary .r>div:first-child{white-space:nowrap}
  .gasto summary .r{order:3;flex-basis:100%;display:flex;justify-content:space-between;align-items:baseline;padding-left:26px;text-align:left!important}
  .li{gap:10px}
}

/* login */
#auth{position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;overflow-y:auto;background:var(--ink);
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(216,195,160,.10),transparent 60%),radial-gradient(700px 400px at -10% 20%,rgba(134,168,231,.08),transparent 60%)}
body.sem-sessao #auth{display:grid}
body.sem-sessao header,body.sem-sessao main{display:none}
.auth-box{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:30px 26px}
.auth-brand{display:flex;flex-direction:column;align-items:center;gap:14px;margin:4px 0 8px}
.auth-brand .wm-jl{font-size:30px}
.auth-brand .wm-fin{font-size:14px}
.auth-box{box-shadow:0 30px 80px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.04);border-color:rgba(216,195,160,.18)}
.auth-box h1{font-family:var(--serif);font-weight:500;font-size:26px;margin:18px 0 6px}
.auth-box p.sub{color:var(--mute);margin:0 0 20px;font-size:14px}
.auth-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--surface2);border-radius:12px;padding:4px;margin-top:18px}
.auth-tabs button{background:none;border:0;color:var(--mute);font:500 14px var(--sans);padding:9px;border-radius:9px;cursor:pointer}
.auth-tabs button.on{background:var(--gold);color:var(--ink)}
.auth-form{display:grid;gap:14px}
.auth-form label{display:grid;gap:6px;font-size:13px;color:var(--text2)}
.auth-form input{background:var(--surface2);border:1px solid var(--line);color:var(--text);font:15px var(--sans);padding:12px 14px;border-radius:12px;width:100%}
.auth-form input:focus{outline:none;border-color:var(--gold2)}
.auth-btn{background:var(--gold);color:var(--ink);border:0;font:600 15px var(--sans);padding:13px;border-radius:12px;cursor:pointer;margin-top:4px}
.auth-btn:disabled{opacity:.6;cursor:wait}
.auth-link{background:none;border:0;color:var(--gold);font:14px var(--sans);cursor:pointer;padding:4px;justify-self:center}
.auth-msg{font-size:14px;border-radius:12px;padding:11px 14px;display:none}
.auth-msg.err{display:block;background:rgba(238,124,124,.12);color:var(--bad);border:1px solid rgba(238,124,124,.3)}
.auth-msg.ok{display:block;background:rgba(92,200,160,.12);color:var(--ok);border:1px solid rgba(92,200,160,.3)}
#carregando{position:fixed;inset:0;z-index:110;display:none;place-items:center;background:var(--ink);color:var(--mute)}
body.carregando #carregando{display:grid}
.userchip{display:flex;align-items:center;gap:8px;flex:none}
.userchip span{font-size:13px;color:var(--mute);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:600px){.userchip span{display:none}}
</style>

async function carregarNuvem(){
  const { data, error } = await sb.from('dados_financeiros').select('dados').eq('user_id', usuario.id).maybeSingle();
  if(error) throw error;
  if(data) return normalizar(data.dados);
  // Primeira vez desta conta: começa vazia. Se este aparelho tem dados da versão sem login, oferece trazer.
  let d = vazio();
  try{
    const local = JSON.parse(localStorage.getItem(KEY));
    if(local && local.v === 1 && (local.gastos?.length || local.cartoes?.length) &&
       confirm('Este aparelho tem dados do controle financeiro de antes do login. Quer trazê-los para a sua conta?')){
      d = normalizar(local);
      localStorage.removeItem(KEY);
    }
  }catch(e){}
  const ins = await sb.from('dados_financeiros').insert({ user_id:usuario.id, dados:d });
  if(ins.error) throw ins.error;
  return d;
}

const fmtISO = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const fmtBR = iso => parseISO(iso).toLocaleDateString('pt-BR');
const mesKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const addMonths = (y, m, k) => { const d = new Date(y, m-1+k, 1); return { y:d.getFullYear(), m:d.getMonth()+1 }; };
const nextRef = (ref, k = 1) => { const [y,m] = ref.split('-').map(Number); const r = addMonths(y, m, k); return `${r.y}-${pad(r.m)}`; };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const mesNome = ref => { const [y,m] = ref.split('-').map(Number); return cap(new Date(y, m-1, 1).toLocaleDateString('pt-BR', {month:'long', year:'numeric'})); };
const mesSo = ref => { const [y,m] = ref.split('-').map(Number); return cap(new Date(y, m-1, 1).toLocaleDateString('pt-BR', {month:'long'})); };
const mesCurto = ref => { const [y,m] = ref.split('-').map(Number); return new Date(y, m-1, 1).toLocaleDateString('pt-BR', {month:'short'}).replace('.', ''); };
const brl = v => Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});

function mix(hex, to, t){
  const a = hex.match(/\w\w/g).map(h => parseInt(h, 16)), b = to.match(/\w\w/g).map(h => parseInt(h, 16));
  return '#' + a.map((v, i) => pad(Math.round(v + (b[i] - v) * t).toString(16))).join('').replace(/(..)/g, s => s.length === 2 ? s : '0' + s);
}

/* ================= regras de fatura ================= */
function faturaDaCompra(c, dataISO){
  const d = parseISO(dataISO);
  let y = d.getFullYear(), m = d.getMonth()+1;
  if(d.getDate() > c.fechamento){ const r = addMonths(y, m, 1); y = r.y; m = r.m; }
  return { y, m };
}
function vencimentoFatura(c, y, m){
  const v = addMonths(y, m, c.vencimento <= c.fechamento ? 1 : 0);
  const last = new Date(v.y, v.m, 0).getDate();
  return fmtISO(new Date(v.y, v.m-1, Math.min(c.vencimento, last)));
}
function vencSemCartao(dia, ref){
  const [y,m] = ref.split('-').map(Number); const last = new Date(y, m, 0).getDate();
  return fmtISO(new Date(y, m-1, Math.min(dia, last)));
}
function criarParcelas(valorTotal, n, dataCompra, cartao, startRef, valorParcela){
  const out = [];
  const base = valorParcela || Math.floor(valorTotal / n * 100) / 100;
  const d = dataCompra ? parseISO(dataCompra) : hoje();
  let ref;
  if(startRef) ref = startRef;
  else if(cartao){ const f = faturaDaCompra(cartao, fmtISO(d)); ref = `${f.y}-${pad(f.m)}`; }
  else ref = mesKey(d);
  for(let i = 0; i < n; i++){
    const valor = valorParcela ? valorParcela : (i < n-1 ? base : round2(valorTotal - base * (n-1)));
    const [y,m] = ref.split('-').map(Number);
    const venc = cartao ? vencimentoFatura(cartao, y, m) : vencSemCartao(d.getDate(), ref);
    out.push({ n:i+1, valor, venc, ref, status:'nao_paga', pagaEm:null });
    ref = nextRef(ref);
  }
  return out;
}
function recalcularVencimentos(c){
  for(const g of db.gastos) if(g.cartaoId === c.id)
    for(const p of g.parcelas){ const [y,m] = p.ref.split('-').map(Number); p.venc = vencimentoFatura(c, y, m); }
}

/* Tudo o que vence numa fatura/mês: parcelas e contas fixas */
function compromissos(ref){
  const out = [];
  for(const g of db.gastos) g.parcelas.forEach((p, i) => {
    if(p.ref === ref) out.push({ kind:'parcela', desc:g.descricao, valor:p.valor, venc:p.venc, paga:p.status === 'paga',
      cartaoId:g.cartaoId, forma:g.forma, categoria:g.categoria, sub:`${p.n} de ${g.n}`, gid:g.id, idx:i, ultima:p.n === g.n && g.n > 1, primeira:p.n === 1 });
  });
  for(const f of db.fixas){
    if(ref < f.desde) continue;
    out.push({ kind:'fixa', desc:f.descricao, valor:f.valor, venc:vencSemCartao(f.dia, ref), paga:!!(f.pagas && f.pagas[ref]),
      cartaoId:null, categoria:f.categoria, sub:'Conta fixa', fid:f.id, ref });
  }
  return out;
}
const stOf = x => x.paga ? 'paga' : parseISO(x.venc) < hoje() ? 'atrasada' : 'aberta';
const PILL = { paga:'<span class="pill ok">Paga</span>', aberta:'<span class="pill open">Em aberto</span>', atrasada:'<span class="pill bad">Em atraso</span>' };
const actOf = x => x.kind === 'parcela' ? `togglePago('${x.gid}',${x.idx})` : `toggleFixa('${x.fid}','${x.ref}')`;

function todosAtrasos(){
  const cur = MES_ATUAL(), refs = new Set();
  db.gastos.forEach(g => g.parcelas.forEach(p => { if(p.ref <= cur) refs.add(p.ref); }));
  db.fixas.forEach(f => { let r = f.desde; while(r <= cur){ refs.add(r); r = nextRef(r); } });
  return [...refs].flatMap(r => compromissos(r)).filter(x => stOf(x) === 'atrasada');
}
// Recebimentos avulsos (não são a renda fixa): entram no mês em que caem
const parcelasEntrada = () => db.entradas.flatMap(e => e.parcelas.map((p, i) => ({ ...p, eid:e.id, idx:i, desc:e.descricao, categoria:e.categoria, total:e.n })));
const entradasDoMes = ref => sum(parcelasEntrada().filter(p => p.ref === ref), p => p.valor);
const baseMensal = (ref = MES_ATUAL()) => db.orcamento > 0 ? db.orcamento : db.renda + entradasDoMes(ref);

/* Avisos automáticos: atrasos, limite, vencimento próximo, parcelamentos que terminam */
function avisos(atrasos){
  const out = [];
  const cur = MES_ATUAL();
  if(atrasos.length) out.push(['bad', I.alert, `<b>${atrasos.length} conta${atrasos.length > 1 ? 's' : ''} em atraso</b>, somando ${M(sum(atrasos, x => x.valor))}. Juros do cartão crescem rápido, priorize essas.`]);
  const em3 = compromissos(cur).concat(compromissos(nextRef(cur))).filter(x => stOf(x) === 'aberta' && (parseISO(x.venc) - hoje()) / 864e5 <= 3);
  if(em3.length) out.push(['warn', I.clock, `<b>${em3.length} vencimento${em3.length > 1 ? 's' : ''} nos próximos 3 dias</b>, no total de ${M(sum(em3, x => x.valor))}.`]);
  for(const c of db.cartoes){
    if(!(c.limite > 0)) continue;
    const usado = sum(db.gastos.filter(g => g.cartaoId === c.id).flatMap(g => g.parcelas).filter(p => p.status !== 'paga'), p => p.valor);
    const p = usado / c.limite * 100;
    if(p >= 80) out.push([p >= 100 ? 'bad' : 'warn', I.card, `<b>${esc(c.nome)} com ${p.toFixed(0)}% do limite usado.</b> Restam ${M(c.limite - usado)}.`]);
  }
  const fins = compromissos(cur).filter(x => x.ultima);
  if(fins.length) out.push(['ok', I.check, `<b>${fins.map(x => esc(x.desc)).join(', ')}</b> ${fins.length > 1 ? 'terminam' : 'termina'} nesta fatura. A partir de ${mesSo(nextRef(cur)).toLowerCase()} sobram ${M(sum(fins, x => x.valor))} por mês.`]);
  const a = sum(compromissos(cur), x => x.valor), b = sum(compromissos(nextRef(cur)), x => x.valor);
  if(a > 0 && b < a - 0.01 && !fins.length) out.push(['ok', I.up, `Em ${mesSo(nextRef(cur)).toLowerCase()} seus compromissos caem para ${M(b)}.`]);
  const aReceber = parcelasEntrada().filter(p => p.ref === cur && p.status !== 'recebida');
  if(aReceber.length) out.push(['ok', I.up, `<b>${M(sum(aReceber, p => p.valor))} a receber em ${mesSo(cur).toLowerCase()}</b>: ${aReceber.slice(0, 3).map(p => esc(p.desc)).join(', ')}${aReceber.length > 3 ? '…' : ''}. Marque quando cair na conta.`]);
  if(baseMensal(nextRef(cur)) > 0){
    const r = nextRef(cur), v = sum(compromissos(r), x => x.valor);
    if(v > baseMensal(r)) out.push(['warn', I.up, `<b>${mesSo(r)} já passa da sua ${db.orcamento > 0 ? 'meta' : 'renda'}</b>: ${M(v)} comprometidos.`]);
  }
  if(!out.length) return '<div class="empty">Nenhum aviso. Suas contas estão sob controle.</div>';
  return out.slice(0, 5).map(([k, ic, t]) => `<div class="alert ${k}"><div class="ic">${ic}</div><div>${t}</div></div>`).join('');
}

function grafProjecao(){
  const refs = []; let r = MES_ATUAL();
  for(let i = 0; i < 12; i++){ refs.push(r); r = nextRef(r); }
  const vals = refs.map(rf => sum(compromissos(rf), x => x.valor));
  if(!vals.some(v => v > 0)) return '<div class="empty">Cadastre um gasto para ver a projeção.</div>';
  const base = baseMensal();
  const W = innerWidth < 600 ? 360 : 640, H = innerWidth < 600 ? 190 : 230, pl = 6, pr = 6, pt = 30, pb = 26;
  const max = Math.max(...vals, base) * 1.12;
  const y = v => pt + (H - pt - pb) * (1 - v / max);
  const bw = (W - pl - pr) / 12, barW = Math.min(30, bw - 10);
  const iMax = vals.indexOf(Math.max(...vals));
  let g = `<line x1="${pl}" x2="${W-pr}" y1="${H-pb}" y2="${H-pb}" stroke="#28334F"/>`;
  vals.forEach((v, i) => {
    const x = pl + i * bw + (bw - barW) / 2, yt = y(v), yb = H - pb, h = yb - yt;
    const fill = i === 0 ? '#D8C3A0' : '#8C7A5C';
    if(h > 0){
      const rr = Math.min(4, h, barW / 2);
      g += `<path d="M${x},${yb} V${yt+rr} Q${x},${yt} ${x+rr},${yt} H${x+barW-rr} Q${x+barW},${yt} ${x+barW},${yt+rr} V${yb} Z" fill="${fill}"/>`;
    }
    g += `<text x="${x + barW/2}" y="${H-8}" text-anchor="middle">${mesCurto(refs[i])}</text>`;
    if((i === 0 || i === iMax) && v > 0) g += `<text class="lbl money" x="${x + barW/2}" y="${yt-7}" text-anchor="middle">${brl(v).replace(/,\d\d$/, '')}</text>`;
    g += `<rect x="${pl + i*bw}" y="${pt-20}" width="${bw}" height="${H-pt-pb+20}" fill="transparent" data-tip="${mesNome(refs[i])}: ${brl(v)}"/>`;
  });
  if(base > 0){
    const yb = y(base);
    g += `<line x1="${pl}" x2="${W-pr}" y1="${yb}" y2="${yb}" stroke="#86A8E7" stroke-dasharray="4 4" stroke-width="1.2"/>`;
    g += `<text x="${W-pr}" y="${yb-6}" text-anchor="end" style="fill:#86A8E7">${db.orcamento > 0 ? 'Sua meta' : 'Sua renda'}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Compromissos dos próximos 12 meses">${g}</svg>`;
}
function grafCategorias(itens){
  const map = {};
  itens.forEach(x => map[x.categoria] = (map[x.categoria] || 0) + x.valor);
  const arr = Object.entries(map).sort((a, b) => b[1] - a[1]);
  if(!arr.length) return '<div class="empty">Nada neste mês ainda.</div>';
  const max = arr[0][1], tot = sum(arr, a => a[1]);

}

function delCartao(id){

}

function vLanc(){
  const q = filtro.q.trim().toLowerCase();
  const casa = (d, c) => !q || d.toLowerCase().includes(q) || c.toLowerCase().includes(q);
  const gastos = filtro.tipo === 'in' ? [] : db.gastos.filter(g => {
    if(!casa(g.descricao, g.categoria)) return false;
    if(filtro.cartao && (filtro.cartao === '__sc' ? g.cartaoId : g.cartaoId !== filtro.cartao)) return false;
    const pend = g.parcelas.some(p => p.status !== 'paga');
    const atr = g.parcelas.some(p => p.status !== 'paga' && parseISO(p.venc) < hoje());
    if(filtro.status === 'ativos' && !pend) return false;
    if(filtro.status === 'quitados' && pend) return false;
    if(filtro.status === 'atraso' && !atr) return false;
    return true;
  });
  const entradas = (filtro.tipo === 'out' || filtro.cartao) ? [] : db.entradas.filter(e => {
    if(!casa(e.descricao, e.categoria)) return false;
    const pend = e.parcelas.some(p => p.status !== 'recebida');
    const atr = e.parcelas.some(p => p.status !== 'recebida' && parseISO(p.data) < hoje());
    if(filtro.status === 'ativos' && !pend) return false;
    if(filtro.status === 'quitados' && pend) return false;
    if(filtro.status === 'atraso' && !atr) return false;
    return true;
  });
  const dataG = g => g.dataCompra || g.parcelas[0].venc, dataE = e => e.parcelas[0].data;

/* Juros compostos, tabela Price (parcelas iguais), como em empréstimos e financiamentos.
   tipo 'total': valor = quanto foi emprestado/comprado; calcula a parcela com juros.
   tipo 'parcela': valor = parcela já com juros; calcula quanto foi emprestado de fato. */
function contaJuros(valor, n, tipo, jurosPct){
  const j = Math.max(0, jurosPct) / 100;
  if(tipo === 'parcela'){
    const total = round2(valor * n);
    const principal = j > 0 ? round2(valor * (1 - Math.pow(1 + j, -n)) / j) : total;
    return { vp:valor, total, principal, juros:jurosPct, custo:round2(total - principal) };
  }
  if(j > 0 && n > 0){
    const vp = round2(valor * j / (1 - Math.pow(1 + j, -n)));
    return { vp, total:round2(vp * n), principal:valor, juros:jurosPct, custo:round2(vp * n - valor) };
  }
  return { vp:null, total:valor, principal:valor, juros:0, custo:0 };
}
/* ---------- taxas de referência ---------- */
const MOD_NOMES = { parcelado:'Cartão: parcelado com juros', rotativo:'Cartão: rotativo (fatura não paga)', pessoal:'Empréstimo pessoal', cheque:'Cheque especial',
  consig_inss:'Consignado INSS', consig_privado:'Consignado privado (CLT)', consig_publico:'Consignado servidor público', veiculo:'Financiamento de veículo', bens:'Financiamento de outros bens' };
const pct = (v, d = 2) => Number(v).toLocaleString('pt-BR', { minimumFractionDigits:d, maximumFractionDigits:d }) + '%';
const bancosDe = mod => TAXAS_BCB.modalidades[mod].bancos.filter(b => b[1] > 0);
const mediana = arr => { const s = [...arr].sort((a, b) => a - b), m = Math.floor(s.length / 2); return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2; };
function opcoesBancos(mod){
  const bs = [...bancosDe(mod)].sort((a, b) => a[0].localeCompare(b[0], 'pt-BR'));
  return `<option value="">Escolha para usar a taxa do banco</option>` + bs.map(b => `<option value="${b[1]}">${esc(b[0])}: ${pct(b[1])} ao mês</option>`).join('');
}
function usarTaxaBanco(){
  const v = val('g-banco'); if(!v) return;
  document.getElementById('g-juros').value = v; document.getElementById('g-vista').value = '';
  prevGasto();

/* Taxa mensal que faz n parcelas iguais valerem o preço à vista hoje (tabela Price, busca binária com 200 passos) */
function taxaImplicita(vista, parcela, n){
  if(!(vista > 0 && parcela > 0 && n > 0) || parcela * n <= vista + 0.005) return 0;
  const pv = r => parcela * (1 - Math.pow(1 + r, -n)) / r;
  let lo = 1e-12, hi = 5;
  for(let i = 0; i < 200; i++){ const mid = (lo + hi) / 2; if(pv(mid) > vista) lo = mid; else hi = mid; }
  return (lo + hi) / 2 * 100;
}
/* Lê o formulário de gasto. Com preço à vista, os juros são descobertos (não digitados). */
function lerGasto(){
  const valor = num(val('g-valor')), n = parseInt(val('g-n')) || 1, tipo = val('g-tipo'), vista = num(val('g-vista'));
  if(vista > 0 && valor > 0 && n > 1){
    const parcela = tipo === 'parcela' ? valor : round2(valor / n), total = round2(parcela * n);
    const t = taxaImplicita(vista, parcela, n);
    return t > 0 ? { vp:parcela, total, principal:vista, juros:Math.round(t * 10000) / 10000, custo:round2(total - vista), implicita:true }
                 : { vp:parcela, total, principal:total, juros:0, custo:0, implicita:true, semJuros:true };
  }
  return { ...contaJuros(valor, n, tipo, num(val('g-juros'))), implicita:false };
}
function prevGasto(){
  const box = document.getElementById('g-prev'); if(!box) return;
  const valor = num(val('g-valor')), n = parseInt(val('g-n')) || 1;
  if(!(valor > 0)){ box.style.display = 'none'; return; }
  const c = lerGasto(), jp = c.juros;
  const jIn = document.getElementById('g-juros');
  if(c.implicita){ jIn.value = jp; jIn.readOnly = true; } else jIn.readOnly = false;
  const parcela = c.vp || round2(c.total / n);
  const anual = jp > 0 ? (Math.pow(1 + jp / 100, 12) - 1) * 100 : 0;
  let html = n === 1 && !(jp > 0)
    ? `À vista: ${M(c.total)}`
    : `<b>${n}x de ${M(parcela)}</b>, total pago ${M(c.total)}.`;
  if(c.implicita) html += c.semJuros
    ? `<br>Sem juros: as parcelas somam até o preço à vista de ${M(num(val('g-vista')))}.`
    : `<br>Juros descobertos pelo preço à vista de ${M(c.principal)}: <b>${pct(jp)} ao mês</b> (${pct(anual, 1)} ao ano). Você paga <span class="badt">${M(c.custo)} a mais</span>.`;
  else if(jp > 0) html += `<br>${val('g-tipo') === 'parcela' ? 'Valor emprestado de fato' : 'Valor emprestado'}: ${M(c.principal)}. Juros de ${pct(jp)} ao mês (${pct(anual, 1)} ao ano): <span class="badt">${M(c.custo)} a mais</span>.`;
  else if(n > 1) html += `<br><span class="mute small">Sem juros. Se tiver juros, preencha "Juros ao mês", escolha o banco ou informe o preço à vista.</span>`;
  if(jp > 0){
    const mod = val('g-bmod'), md = mediana(bancosDe(mod).map(b => b[1]));
    html += `<br><span class="mute small">Referência: a taxa mediana dos bancos em "${MOD_NOMES[mod]}" é ${pct(md)} ao mês (Banco Central, ${TAXAS_BCB.periodo}). A sua está ${jp > md * 1.05 ? 'acima' : jp < md * 0.95 ? 'abaixo' : 'perto'} da mediana.</span>`;
  }
  box.style.display = 'block'; box.innerHTML = html;
}

/* ---------- recebimentos (entradas avulsas) ---------- */
function addEntrada(e){
  e.preventDefault();
  const valor = num(val('e-valor')), n = Math.max(1, Math.min(72, parseInt(val('e-n')) || 1));
  if(valor <= 0){ toast('Informe um valor maior que zero'); return; }
  const vp = val('e-tipo') === 'parcela' || n === 1 ? valor : null;
  const total = vp ? round2(vp * n) : valor;
  const base = vp || Math.floor(total / n * 100) / 100;
  const d0 = parseISO(val('e-data')), dia = d0.getDate(), jaRecebi = val('e-st') === 'sim';
  let ref = mesKey(d0);
  const parcelas = [];
  for(let i = 0; i < n; i++){
    const v = vp ? vp : (i < n - 1 ? base : round2(total - base * (n - 1)));
    const data = i === 0 ? val('e-data') : vencSemCartao(dia, ref);
    const recebida = jaRecebi && parseISO(data) <= hoje();
    parcelas.push({ n:i + 1, valor:v, data, ref, status:recebida ? 'recebida' : 'a_receber', recebidaEm:recebida ? data : null });
    ref = nextRef(ref);
  }
  db.entradas.push({ id:uid(), descricao:val('e-desc').trim(), valorTotal:total, n, categoria:val('e-cat'), parcelas });
  novoGasto = false; save(); render(); toast('Recebimento adicionado');
}

function salvarEntrada(ev, id){
  ev.preventDefault();

  e.descricao = val('ee-desc').trim() || e.descricao;
  e.categoria = val('ee-cat');
  const vp = num(val('ee-vp'));
  if(vp > 0 && Math.abs(vp - e.parcelas[0].valor) > 0.001){ e.parcelas.forEach(p => p.valor = vp); e.valorTotal = round2(vp * e.n); }
  const d = val('ee-data');
  if(d && d !== e.parcelas[0].data){
    const d0 = parseISO(d); let ref = mesKey(d0);
    e.parcelas.forEach((p, i) => { p.ref = ref; p.data = i === 0 ? d : vencSemCartao(d0.getDate(), ref); ref = nextRef(ref); });
  }
  editEntrada = null; save(); render(); toast('Recebimento atualizado');

  const ref = val('eg-ref');
  if(ref && ref !== g.parcelas[0].ref){
    const dia = g.dataCompra ? parseISO(g.dataCompra).getDate() : 10;
    let r = ref;
    g.parcelas.forEach(p => { p.ref = r; const [y,m] = r.split('-').map(Number); p.venc = cart ? vencimentoFatura(cart, y, m) : vencSemCartao(dia, r); r = nextRef(r); });
  }
  const k = Math.max(0, Math.min(g.n, parseInt(val('eg-pagas')) || 0));
  if(k !== g.parcelas.filter(p => p.status === 'paga').length) g.parcelas.forEach((p, i) => { p.status = i < k ? 'paga' : 'nao_paga'; p.pagaEm = i < k ? (p.pagaEm || fmtISO(hoje())) : null; });
  editGasto = null; save(); render(); toast('Lançamento atualizado');
}

  </tbody></table></div>`;

const aliquotaIR = dias => TAXAS_REF.ir.find(([lim]) => dias <= lim)[1];
function calcRende(e){
  e.preventDefault();
  const v = num(val('iv-valor')), meses = Math.max(1, Math.round(num(val('iv-meses')))), tipo = val('iv-tipo');
  const p = tipo === 'selic' ? 100 : Math.max(0, num(val('iv-pct')));
  let fator, nome;
  if(tipo === 'poup'){ fator = Math.pow(1 + TAXAS_REF.indices.poupanca.valor / 100, meses); nome = 'Poupança'; }
  else {
    const diaCdi = Math.pow(1 + TAXAS_REF.indices.cdi.valor / 100, 1 / 252) - 1;
    fator = Math.pow(1 + diaCdi * p / 100, Math.round(meses * 21));
    nome = tipo === 'selic' ? 'Tesouro Selic' : `${tipo === 'lci' ? 'LCI/LCA' : 'CDB'} de ${pct(p, 0)} do CDI`;
  }
  const bruto = round2(v * (fator - 1));
  // prazo em dias corridos (mês médio de 30,4375 dias): 6 meses = 183 dias, 12 meses = 365 dias
  const aliq = tipo === 'cdb' || tipo === 'selic' ? aliquotaIR(Math.round(meses * 30.4375)) : 0;
  const ir = round2(bruto * aliq / 100), liq = round2(bruto - ir), final = round2(v + liq);
  const mensal = (Math.pow(final / v, 1 / meses) - 1) * 100;
  $('#res-rende').innerHTML = `<div class="res">
    <b>${nome}</b>, ${meses} ${meses > 1 ? 'meses' : 'mês'}: rende ${M(bruto)} bruto.<br>
    ${aliq ? `Imposto de renda de ${pct(aliq, 1)} sobre o lucro: ${M(ir)}.<br>` : 'Isento de imposto de renda.<br>'}
    Você fica com <b class="good">${M(final)}</b> (lucro líquido de ${M(liq)}), ou ${pct(mensal)} ao mês livre.
    ${tipo === 'selic' ? '<br><span class="mute small">No Tesouro Selic há taxa da B3 de 0,20% ao ano sobre o que passar de R$ 10 mil.</span>' : ''}</div>`;
}
function calcMaq(e){
  e.preventDefault();
  const v = num(val('mq-valor')), i = parseInt(val('mq-n')), tab = TAXAS_REF.maquininha.find(t => t.id === val('mq-tab'));
  const t = tab.t[i];
  if(t == null){ $('#res-maq').innerHTML = '<div class="res">Essa tabela não aceita débito. Escolha crédito.</div>'; return; }
  const desc = round2(v * t / 100), recebe = round2(v - desc);
  const cobrar = round2(v / (1 - t / 100));
  const forma = i === 0 ? 'no débito' : i === 1 ? 'no crédito à vista' : `no crédito em ${i}x`;
  $('#res-maq').innerHTML = `<div class="res">
    Taxa de <b>${pct(t)}</b> ${forma}: descontam ${M(desc)} e você recebe <b class="good">${M(recebe)}</b>.<br>
    Para receber ${M(v)} limpos, cobre ${M(cobrar)}${i >= 2 ? ` (${i}x de ${M(round2(cobrar / i))})` : ''}.</div>`;
}

function toggleFixa(id, ref){

  if(f.pagas[ref]){ delete f.pagas[ref]; toast('Conta reaberta'); } else { f.pagas[ref] = true; toast('Conta paga'); }
  save(); render();
}
function delFixa(id){

  if(!confirm(`Excluir a conta fixa ${f.descricao}?`)) return;
  db.fixas = db.fixas.filter(x => x.id !== id); save(); render(); toast('Conta fixa excluída');
}

function calcCompromisso(e){
  e.preventDefault();
  const v = num(val('c-valor')), n = Math.max(1, Math.min(72, parseInt(val('c-n')) || 1)), j = num(val('c-juros')) / 100;
  const c = val('c-cartao') ? cardOf(val('c-cartao')) : null;
  const pmt = round2(j > 0 ? v * j / (1 - Math.pow(1 + j, -n)) : v / n), total = round2(pmt * n);
  let ref;
  if(c){ const f = faturaDaCompra(c, fmtISO(hoje())); ref = `${f.y}-${pad(f.m)}`; } else ref = MES_ATUAL();
  const base = baseMensal();
  let pior = 0, piorRef = '', rows = '';
  for(let i = 0; i < n; i++){
    const atual = sum(compromissos(ref), x => x.valor), novo = atual + pmt;
    if(novo > pior){ pior = novo; piorRef = ref; }
    rows += `<tr><td>${mesNome(ref)}</td><td style="text-align:right">${M(atual)}</td><td style="text-align:right">${M(pmt)}</td><td style="text-align:right"><b>${M(novo)}</b></td>${base > 0 ? `<td>${novo > base ? '<span class="pill bad">Passa</span>' : '<span class="pill ok">Cabe</span>'}</td>` : ''}</tr>`;
    ref = nextRef(ref);
  }
  let v1 = base > 0
    ? (pior <= base ? `<div class="good">Cabe. O mês mais pesado fica em ${M(pior)}, dentro da sua ${db.orcamento > 0 ? 'meta' : 'renda'} de ${M(base)}.</div>`
                    : `<div class="badt">Não cabe. Em ${mesNome(piorRef).toLowerCase()} o total chega a ${M(pior)}, acima da sua ${db.orcamento > 0 ? 'meta' : 'renda'} de ${M(base)}.</div>`)
    : `<div class="mute">Informe sua renda acima para saber se cabe.</div>`;
  if(c && c.limite > 0){
    const usado = sum(db.gastos.filter(g => g.cartaoId === c.id).flatMap(g => g.parcelas).filter(p => p.status !== 'paga'), p => p.valor);
    const disp = c.limite - usado;
    v1 += total > disp ? `<div class="badt">Estoura o limite do ${esc(c.nome)}: disponível ${M(disp)}, compra de ${M(total)}.</div>`
                       : `<div class="good">Cabe no limite do ${esc(c.nome)}, sobrando ${M(disp - total)}.</div>`;
  }
  $('#res-comp').innerHTML = `<div class="res">
    <div>${n}x de <b>${M(pmt)}</b>, total de <b>${M(total)}</b>${j > 0 ? `, sendo ${M(total - v)} de juros` : ''}.</div>
    <div style="margin:10px 0 6px">${v1}</div>
    <div style="overflow-x:auto"><table><thead><tr><th>Fatura</th><th style="text-align:right">Já comprometido</th><th style="text-align:right">Esta compra</th><th style="text-align:right">Total</th>${base > 0 ? '<th></th>' : ''}</tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function calcTaxa(e){
  e.preventDefault();
  const vista = num(val('t-vista')), parc = num(val('t-parc')), n = Math.floor(num(val('t-n')));
  if(parc * n <= vista){ $('#res-taxa').innerHTML = `<div class="res"><span class="good">Sem juros.</span> O parcelado custa ${M(parc*n)}, igual ou menor que o à vista.</div>`; return; }
  const pv = r => parc * (1 - Math.pow(1 + r, -n)) / r;
  let lo = 1e-9, hi = 2;
  for(let i = 0; i < 120; i++){ const mid = (lo + hi) / 2; if(pv(mid) > vista) lo = mid; else hi = mid; }
  const t = (lo + hi) / 2, anual = (Math.pow(1 + t, 12) - 1) * 100, extra = parc * n - vista;
  $('#res-taxa').innerHTML = `<div class="res">
    Taxa embutida de <b class="${t*100 > 2 ? 'badt' : ''}">${(t*100).toFixed(2)}% ao mês</b>, ou ${anual.toFixed(1)}% ao ano.<br>
    Você paga ${M(extra)} a mais, ${(extra / vista * 100).toFixed(1)}% sobre o à vista.<br>
    <span class="mute small">${t*100 > 1 ? 'Se tiver o dinheiro, pagar à vista sai mais barato.' : 'Juros baixos. Parcelar pode valer a pena se o dinheiro render no meio tempo.'}</span></div>`;
}
function calcRotativo(e){
  e.preventDefault();
  const s = num(val('r-saldo')), r = num(val('r-taxa')) / 100, m = Math.max(1, Math.floor(num(val('r-meses'))));
  const fim = s * Math.pow(1 + r, m);
  $('#res-rot').innerHTML = `<div class="res">
    Depois de ${m} ${m > 1 ? 'meses' : 'mês'}: <b class="badt">${M(fim)}</b><br>
    Só de juros: ${M(fim - s)}, ou ${((fim / s - 1) * 100).toFixed(0)}% a mais.<br>
    <span class="mute small">Juros compostos, sem pagamentos no período. IOF e multa aumentam o valor.</span></div>`;
}

/* ================= backup ================= */
function exportar(){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db, null, 2)], { type:'application/json' }));
  a.download = `controle-financeiro-${fmtISO(hoje())}.json`; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000); toast('Backup exportado');
}
function importar(ev){
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(d.v !== 1 || !Array.isArray(d.cartoes) || !Array.isArray(d.gastos)) throw 0;
      if(!confirm('Substituir os dados atuais pelos do backup?')) return;
      db = normalizar(d);
      save(); render(); toast('Backup importado');
    }catch(err){ toast('Arquivo de backup inválido'); }
    ev.target.value = '';
  };
  r.readAsText(f);
}

/* ================= dica do gráfico ================= */
document.addEventListener('mousemove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]'), tip = $('#tip');
  if(!t || document.body.classList.contains('privado')){ tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8);
  tip.style.left = x + 'px'; tip.style.top = (e.clientY - 40) + 'px';
});
document.addEventListener('click', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if(t && !document.body.classList.contains('privado')) toast(t.dataset.tip);
});

let _w = innerWidth;
addEventListener('resize', () => { clearTimeout(window._rs); window._rs = setTimeout(() => { if((innerWidth < 600) !== (_w < 600) && tab === 'inicio') render(); _w = innerWidth; }, 200); });

/* ================= login ================= */
let authModo = 'entrar';
const ERROS = {
  'Invalid login credentials':'E-mail ou senha incorretos.',
  'Email not confirmed':'Seu e-mail ainda não foi confirmado. Abra o link que enviamos para você.',
  'User already registered':'Já existe uma conta com esse e-mail. Use a opção Entrar.',
  'Password should be at least 6 characters.':'A senha precisa ter pelo menos 6 caracteres.',
  'Unable to validate email address: invalid format':'Esse e-mail não parece válido.',
  'Email rate limit exceeded':'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.'
};
const traduzErro = e => ERROS[e?.message] || (e?.message?.includes('rate limit') ? ERROS['Email rate limit exceeded'] : 'Algo deu errado. Tente de novo.');
const urlRetorno = () => location.origin + location.pathname;

function telaAuth(modo, msg, tipo){
  authModo = modo;
  const abas = (modo === 'entrar' || modo === 'criar') ? `<div class="auth-tabs" role="tablist">
      <button class="${modo==='entrar'?'on':''}" onclick="telaAuth('entrar')">Entrar</button>
      <button class="${modo==='criar'?'on':''}" onclick="telaAuth('criar')">Criar conta</button></div>` : '';
  const caixaMsg = `<div class="auth-msg ${msg ? (tipo || 'err') : ''}" id="auth-msg">${esc(msg || '')}</div>`;
  let corpo;
  if(modo === 'entrar') corpo = `
    <h1>Bem-vindo de volta</h1><p class="sub">Entre para ver os seus gastos. Só você tem acesso a eles.</p>
    <form class="auth-form" onsubmit="event.preventDefault();entrar()">
      ${caixaMsg}
      <label>E-mail<input id="a-email" type="email" autocomplete="email" required></label>
      <label>Senha<input id="a-senha" type="password" autocomplete="current-password" required></label>
      <button class="auth-btn" id="a-btn">Entrar</button>
      <button type="button" class="auth-link" onclick="telaAuth('esqueci')">Esqueci minha senha</button>
    </form>`;
  else if(modo === 'criar') corpo = `
    <h1>Crie sua conta</h1><p class="sub">Leva um minuto. Seus dados ficam guardados só na sua conta, separados de qualquer outra pessoa.</p>
    <form class="auth-form" onsubmit="event.preventDefault();criarConta()">
      ${caixaMsg}
      <label>Nome<input id="a-nome" type="text" autocomplete="name" required></label>
      <label>E-mail<input id="a-email" type="email" autocomplete="email" required></label>
      <label>Senha (mínimo 6 caracteres)<input id="a-senha" type="password" autocomplete="new-password" minlength="6" required></label>
      <label>Repita a senha<input id="a-senha2" type="password" autocomplete="new-password" minlength="6" required></label>
      <button class="auth-btn" id="a-btn">Criar conta</button>
    </form>`;
  else if(modo === 'esqueci') corpo = `
    <h1>Recuperar senha</h1><p class="sub">Informe seu e-mail. Enviaremos um link para você criar uma senha nova.</p>
    <form class="auth-form" onsubmit="event.preventDefault();esqueciSenha()">
      ${caixaMsg}
      <label>E-mail<input id="a-email" type="email" autocomplete="email" required></label>
      <button class="auth-btn" id="a-btn">Enviar link</button>
      <button type="button" class="auth-link" onclick="telaAuth('entrar')">Voltar para o login</button>
    </form>`;
  else corpo = `
    <h1>Nova senha</h1><p class="sub">Digite a senha nova da sua conta.</p>
    <form class="auth-form" onsubmit="event.preventDefault();novaSenha()">
      ${caixaMsg}
      <label>Senha nova<input id="a-senha" type="password" autocomplete="new-password" minlength="6" required></label>
      <button class="auth-btn" id="a-btn">Salvar senha</button>
    </form>`;
  $('#auth-corpo').innerHTML = abas + corpo;
  document.body.classList.add('sem-sessao');
  document.body.classList.remove('carregando');
}
function authAviso(msg, tipo){ const m = $('#auth-msg'); m.className = 'auth-msg ' + (tipo || 'err'); m.textContent = msg; }
function authOcupado(on){ const b = $('#a-btn'); if(b) b.disabled = on; }

async function entrar(){
  authOcupado(true);
  const { error } = await sb.auth.signInWithPassword({ email:val('a-email').trim(), password:val('a-senha') });
  authOcupado(false);
  if(error) authAviso(traduzErro(error));
}
async function criarConta(){
  if(val('a-senha') !== val('a-senha2')) return authAviso('As duas senhas não são iguais.');
  authOcupado(true);
  const email = val('a-email').trim();
  const { data, error } = await sb.auth.signUp({ email, password:val('a-senha'),
    options:{ data:{ nome:val('a-nome').trim() }, emailRedirectTo:urlRetorno() } });
  authOcupado(false);
  if(error) return authAviso(traduzErro(error));
  if(data.user && data.user.identities && data.user.identities.length === 0) return authAviso(ERROS['User already registered']);
  if(!data.session) telaAuth('entrar', `Conta criada! Enviamos um link de confirmação para ${email}. Abra o link e depois entre aqui.`, 'ok');
}
async function esqueciSenha(){
  authOcupado(true);
  const { error } = await sb.auth.resetPasswordForEmail(val('a-email').trim(), { redirectTo:urlRetorno() });
  authOcupado(false);
  if(error) return authAviso(traduzErro(error));
  authAviso('Se esse e-mail tiver conta, o link para criar uma senha nova chega em instantes.', 'ok');
}
async function novaSenha(){
  authOcupado(true);
  const { error } = await sb.auth.updateUser({ password:val('a-senha') });
  authOcupado(false);
  if(error) return authAviso(traduzErro(error));
  toast('Senha alterada');
  abrirApp(usuario);
}
async function sair(){
  clearTimeout(save._t); await enviarNuvem();
  await sb.auth.signOut();
}

async function abrirApp(user){
  usuario = user;
  document.body.classList.add('carregando');
  try{
    db = await carregarNuvem();
  }catch(e){
    usuario = null;
    return telaAuth('entrar', 'Não foi possível carregar seus dados. Verifique a internet e entre de novo.');
  }
  migrarCores();
  tab = 'inicio'; novoCartao = false; editCard = null; novoGasto = false; editGasto = null;
  filtro = { q:'', cartao:'', status:'ativos' }; abertos = new Set(); fat = { card:null, ref:null };
  const nome = user.user_metadata?.nome;
  $('#user-email').textContent = nome ? `${nome} · ${user.email}` : user.email;
  document.body.classList.remove('sem-sessao', 'carregando');
  render();
}

let _uidAtual = null;
sb.auth.onAuthStateChange((evento, sessao) => {
  if(evento === 'PASSWORD_RECOVERY'){ usuario = sessao.user; return telaAuth('nova-senha'); }
  const user = sessao?.user || null;
  if(user && user.id !== _uidAtual){ _uidAtual = user.id; setTimeout(() => abrirApp(user), 0); }
  else if(!user && (_uidAtual !== null || evento === 'INITIAL_SESSION')){
    _uidAtual = null; usuario = null; db = vazio();
    $('#main').innerHTML = ''; $('#user-email').textContent = '';
    telaAuth('entrar');
  }
});
</script>
